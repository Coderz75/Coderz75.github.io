<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <meta name="author" content="Nuaym Syed">
    <link rel="icon" href="favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* ==========================================================================
           TOKENS (same palette as the portfolio index)
           ========================================================================== */
        :root {
            --bg: #1b1b1b;
            --bg-deep: #141414;
            --fg: #dbdbdb;
            --fg-strong: #ffffff;
            --fg-soft: #b5b5b5;
            --muted: #888888;
            --line: #333333;
            --accent: #79c0ff;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html { background: var(--bg); }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Courier New', Courier, 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.5;
            letter-spacing: 0.08em;
        }

        .hidden { display: none !important; }
        .muted { color: var(--muted); }

        .wrap { max-width: 760px; margin: 0 auto; padding-left: 20px; padding-right: 20px; }
        main.wrap { padding-top: 40px; padding-bottom: 80px; }

        /* ==========================================================================
           TOP BAR + PROGRESS
           ========================================================================== */
        #progress-bar {
            position: fixed; top: 0; left: 0; height: 2px; width: 0;
            background: var(--accent); z-index: 100;
        }

        .topbar {
            position: sticky; top: 0; z-index: 50;
            background: var(--bg);
            border-bottom: 1px dashed var(--line);
        }
        .topbar-inner {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; padding-top: 14px; padding-bottom: 14px;
        }
        .brand {
            color: var(--fg-strong); text-decoration: none; text-transform: uppercase;
        }
        .brand:hover, .brand:focus-visible { color: var(--accent); outline: none; }

        /* ==========================================================================
           TERMINAL BUTTON (same as the index)
           ========================================================================== */
        .terminal-btn {
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--accent);
            background-color: transparent;
            border: 1px dashed var(--accent);
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }
        .terminal-btn:hover, .terminal-btn:focus-visible {
            color: var(--bg);
            background-color: var(--accent);
            border-style: solid;
            outline: none;
        }
        .terminal-btn:active { transform: translateY(1px); opacity: 0.85; }

        /* ==========================================================================
           HEADINGS / RULES
           ========================================================================== */
        h1 {
            font-size: 1.75rem; line-height: 1.25; font-weight: normal;
            text-transform: uppercase; color: var(--fg-strong);
            margin: 0 0 0.4rem;
        }
        hr.dashed { border: none; border-top: 1px dashed var(--line); margin: 1rem 0; }
        #intro { margin: 0 0 1.5rem; }

        /* ==========================================================================
           LISTING (posts and projects in one list)
           ========================================================================== */
        .entries { list-style: none; margin: 0; padding: 0; border-top: 1px dashed var(--line); }
        .entries li { border-bottom: 1px dashed var(--line); }

        .entry {
            display: grid;
            grid-template-columns: 1fr auto;
            column-gap: 16px;
            row-gap: 2px;
            padding: 12px 0 12px 12px;
            border-left: 2px solid var(--line);
            color: inherit;
            text-decoration: none;
        }
        .entry-title { text-transform: uppercase; color: #e0e0e0; }
        .entry-title::before { content: '>'; color: var(--muted); font-weight: bold; margin-right: 8px; }
        .entry-date { color: var(--muted); font-size: 11px; letter-spacing: 0.05em; white-space: nowrap; align-self: center; }
        .entry-desc {
            grid-column: 1 / -1;
            color: var(--fg-soft);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            padding-left: 1.5em;
        }
        .entry-tags { grid-column: 1 / -1; color: var(--muted); font-size: 11px; letter-spacing: 0.05em; padding-left: 1.5em; }
        .entry-tags:empty { display: none; }
        .ext { color: var(--muted); }

        .entry:hover, .entry:focus-visible { border-left-color: var(--accent); outline: none; }
        .entry:hover .entry-title::before, .entry:focus-visible .entry-title::before { color: var(--accent); }
        .entry:hover .t, .entry:focus-visible .t { background: var(--accent); color: var(--bg); }

        /* ==========================================================================
           POST HEADER
           ========================================================================== */
        #hero-image { margin-bottom: 2rem; border: 1px dashed var(--line); padding: 6px; }
        #hero-image img { display: block; width: 100%; max-height: 288px; object-fit: cover; }

        .meta-line { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 11px; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
        #post-meta h1 { font-size: 1.6rem; }
        .lede { color: var(--fg); margin: 0.75rem 0 0; }
        .meta-tech { color: var(--muted); font-size: 11px; letter-spacing: 0.05em; margin: 1rem 0 0; }
        .meta-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 1.25rem; }

        /* ==========================================================================
           MARKDOWN CONTENT
           ========================================================================== */
        .prose { color: var(--fg); line-height: 1.75; letter-spacing: 0.05em; overflow-wrap: break-word; }
        .prose > :first-child { margin-top: 0; }
        .prose h1, .prose h2, .prose h3, .prose h4 {
            color: var(--fg-strong); font-weight: normal; line-height: 1.3; text-transform: uppercase;
        }
        .prose h1 { font-size: 1.5rem; margin: 2.5rem 0 1rem; }
        .prose h2 { font-size: 1.15rem; margin: 2.5rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px dashed var(--line); }
        .prose h3 { font-size: 1rem; margin: 2rem 0 0.5rem; }
        .prose h4 { font-size: 0.95rem; margin: 1.5rem 0 0.5rem; }
        .prose h1::before { content: '# '; color: var(--muted); }
        .prose h2::before { content: '## '; color: var(--muted); }
        .prose h3::before { content: '### '; color: var(--muted); }
        .prose h4::before { content: '#### '; color: var(--muted); }

        .prose p { margin: 1.1rem 0; }
        .prose strong { color: var(--fg-strong); font-weight: bold; }
        .prose em { font-style: italic; }
        .prose ul, .prose ol { margin: 1.1rem 0; padding-left: 1.5rem; }
        .prose li { margin: 0.35rem 0; }
        .prose li::marker { color: var(--muted); }

        .prose a, .inline-link {
            color: var(--accent); text-decoration: none;
            border-bottom: 1px dotted var(--accent);
            padding: 0 2px; border-radius: 2px;
            transition: color 0.2s ease, background-color 0.2s ease, border-bottom-color 0.2s ease;
        }
        .prose a:hover, .prose a:focus-visible, .inline-link:hover, .inline-link:focus-visible {
            color: var(--bg); background-color: var(--accent); border-bottom-color: transparent; outline: none;
        }

        .prose blockquote {
            margin: 1.5rem 0; padding: 0.25rem 0 0.25rem 1rem;
            border-left: 2px solid var(--line); color: var(--fg-soft);
        }
        .prose blockquote p { margin: 0.5rem 0; }

        .prose code:not(pre code) {
            background: #262626; border: 1px solid var(--line); border-radius: 2px;
            color: #e0e0e0; padding: 0 0.35em; font-size: 0.92em;
        }
        .prose pre {
            background: var(--bg-deep) !important;
            border: 1px dashed var(--line); border-radius: 2px;
            padding: 1rem 1.25rem; margin: 1.5rem 0; overflow-x: auto;
            letter-spacing: 0.02em; line-height: 1.6;
        }
        .prose pre code { font-family: inherit; font-size: 13px; background: transparent !important; padding: 0; color: inherit; }

        .prose hr { border: none; border-top: 1px dashed var(--line); margin: 2.5rem 0; }
        .prose img { display: block; max-width: 100%; margin: 2rem 0; border: 1px solid var(--line); }
        .prose table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; margin: 1.5rem 0; }
        .prose th { color: var(--muted); text-align: left; text-transform: uppercase; font-size: 11px; font-weight: normal; padding: 8px 12px; border: 1px dashed var(--line); }
        .prose td { padding: 8px 12px; border: 1px dashed var(--line); }

        /* ==========================================================================
           FOOTER / STATES
           ========================================================================== */
        .post-footer {
            margin-top: 4rem; padding-top: 1.25rem;
            border-top: 1px dashed var(--line);
            display: flex; flex-wrap: wrap; gap: 12px;
            align-items: center; justify-content: space-between;
        }

        .cursor { animation: blink 1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) {
            .cursor { animation: none; }
            .terminal-btn, .prose a { transition: none; }
        }

        @media (max-width: 600px) {
            main.wrap { padding-top: 28px; }
            h1 { font-size: 1.4rem; }
            #post-meta h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div id="progress-bar"></div>

    <header class="topbar">
        <div class="wrap topbar-inner">
            <a class="brand" href="index.html">Nuaym S. Syed</a>
            <a id="back-link" class="terminal-btn" href="index.html"><span aria-hidden="true">←</span> <span id="back-label">Back</span></a>
        </div>
    </header>

    <main class="wrap">

        <!-- Loading -->
        <p id="loading" class="muted">Loading<span class="cursor">_</span></p>

        <!-- Not found -->
        <div id="not-found" class="hidden">
            <h1>404</h1>
            <hr class="dashed">
            <p>That page doesn't exist. It may have been moved or renamed.</p>
            <p><a class="inline-link" href="post.html">Back to the blog</a></p>
        </div>

        <!-- Content -->
        <article id="post-container" class="hidden">

            <!-- Hero image (projects only) -->
            <div id="hero-image" class="hidden">
                <img id="hero-img-el" src="" alt="">
            </div>

            <div id="post-meta"></div>

            <hr class="dashed">

            <div id="post-content" class="prose"></div>

            <div id="post-footer" class="post-footer"></div>
        </article>

    </main>

    <script>
        const SITE_AUTHOR = 'Nuaym Syed';
        const BLOG_URL = 'post.html';

        marked.setOptions({ breaks: true, gfm: true });

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));

        window.addEventListener('hashchange', () => {
            window.location.reload();
        });

        // The page id comes from ?p=... . The old #... form is still accepted so
        // existing links keep working (some sites, e.g. LinkedIn, strip the fragment).
        function getPageId() {
            const param = new URLSearchParams(window.location.search).get('p');
            if (param) return param;
            return decodeURIComponent(window.location.hash.substring(1));
        }

        function setBackLink(href, label) {
            document.getElementById('back-link').href = href;
            document.getElementById('back-label').textContent = label;
        }

        async function init() {
            const id = getPageId();
            if (!id) { await showListing(); return; }

            const isProject = id.startsWith('project-');
            const slug = isProject ? id.slice('project-'.length) : id;

            // Rewrite legacy #slug URLs to ?p=slug so "Copy link" always yields a
            // fragment-free, shareable URL.
            if (window.location.hash && !new URLSearchParams(window.location.search).get('p')) {
                history.replaceState(null, '', `${BLOG_URL}?p=${encodeURIComponent(id)}`);
            }

            const folder = isProject ? 'projects' : 'posts';
            setBackLink(BLOG_URL, 'Blog');

            if (!slug) { showNotFound(); return; }

            // 1. Fetch metadata
            let meta;
            try {
                const res = await fetch(isProject ? `${folder}/index_proj.json` : `${folder}/index.json`);
                if (!res.ok) throw new Error();
                const all = await res.json();
                meta = all.find(p => p.slug === slug);
            } catch {
                showNotFound(); return;
            }
            if (!meta) { showNotFound(); return; }

            // 2. Fetch markdown
            let markdown;
            try {
                const res = await fetch(`${folder}/${slug}.md`);
                if (!res.ok) throw new Error();
                markdown = await res.text();
            } catch {
                showNotFound(); return;
            }

            // 3. Page title
            document.title = `${meta.title} — ${SITE_AUTHOR}`;

            // 4. Hero image (projects only)
            if (isProject && meta.image) {
                document.getElementById('hero-image').classList.remove('hidden');
                document.getElementById('hero-img-el').src = meta.image;
                document.getElementById('hero-img-el').alt = meta.title;
            }

            // 5. Meta block
            const tagsHtml = (meta.tags || []).map(t => `<span>[${esc(t)}]</span>`).join('');
            const metaLine = (meta.date || tagsHtml) ? `
                <div class="meta-line">
                    ${meta.date ? `<span>${esc(meta.date)}</span>` : ''}
                    ${tagsHtml}
                </div>` : '';

            const techHtml = isProject && meta.tech?.length
                ? `<p class="meta-tech">Notable Technologies: ${meta.tech.map(t => esc(t)).join(', ')}</p>`
                : '';

            const demoUrl = meta.demo || meta.customLink;
            const linkButtons = [
                isProject && meta.github
                    ? `<a class="terminal-btn" href="${esc(meta.github)}" target="_blank" rel="noopener noreferrer">Source code</a>` : '',
                isProject && demoUrl
                    ? `<a class="terminal-btn" href="${esc(demoUrl)}" target="_blank" rel="noopener noreferrer">Live demo</a>` : '',
            ].filter(Boolean).join('');
            const linksHtml = linkButtons ? `<div class="meta-links">${linkButtons}</div>` : '';

            const description = meta.description || meta.summary || '';
            document.getElementById('post-meta').innerHTML = `
                ${metaLine}
                <h1>${esc(meta.title)}</h1>
                ${description ? `<p class="lede">${esc(description)}</p>` : ''}
                ${techHtml}
                ${linksHtml}
            `;

            // 6. Render markdown
            document.getElementById('post-content').innerHTML = marked.parse(markdown);

            // 7. Footer
            document.getElementById('post-footer').innerHTML = `
                <a class="terminal-btn" href="${BLOG_URL}"><span aria-hidden="true">←</span> Blog</a>
                <button type="button" class="terminal-btn" id="share-btn">Copy link</button>
            `;
            document.getElementById('share-btn').addEventListener('click', copyLink);

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('post-container').classList.remove('hidden');

            hljs.highlightAll();
        }

        // Turn a date string like "Mar. 2025", "2025-03-14" or "Mar. 2025 - Present"
        // into a number so entries can be sorted. Unparseable dates sort last.
        function dateKey(str) {
            if (!str) return -Infinity;
            const last = String(str).split(/\s[-–—]\s/).pop().trim();
            if (/present/i.test(last)) return Date.now();
            const t = Date.parse(last.replace(/\./g, ''));
            return Number.isNaN(t) ? -Infinity : t;
        }

        async function showListing() {
            document.title = `Blog — ${SITE_AUTHOR}`;
            setBackLink('index.html', 'Home');

            let posts = [], projects = [];
            try {
                const res = await fetch('posts/index.json');
                if (res.ok) posts = await res.json();
            } catch {}
            try {
                const res = await fetch('projects/index_proj.json');
                if (res.ok) projects = await res.json();
            } catch {}

            // One combined list, newest first (stable, so ties keep their file order).
            const entries = [
                ...posts.map(p => ({ ...p, isProject: false })),
                ...projects.map(p => ({ ...p, isProject: true })),
            ].sort((a, b) => dateKey(b.date) - dateKey(a.date));

            const rows = entries.map(e => {
                const href = e.isProject
                    ? (e.customLink || `${BLOG_URL}?p=project-${encodeURIComponent(e.slug)}`)
                    : `${BLOG_URL}?p=${encodeURIComponent(e.slug)}`;
                const external = /^https?:/.test(href);
                const target = external ? ' target="_blank" rel="noopener noreferrer"' : '';
                const tags = [...(e.tags || []), ...(e.tech || [])].slice(0, 4)
                    .map(t => `[${esc(t)}]`).join(' ');
                const description = e.summary || e.description || '';

                return `
                <li>
                    <a class="entry" href="${esc(href)}"${target}>
                        <span class="entry-title"><span class="t">${esc(e.title)}</span>${external ? ' <span class="ext">↗</span>' : ''}</span>
                        ${e.date ? `<span class="entry-date">${esc(e.date)}</span>` : ''}
                        ${description ? `<span class="entry-desc">${esc(description)}</span>` : ''}
                        <span class="entry-tags">${tags}</span>
                    </a>
                </li>`;
            }).join('');

            const container = document.getElementById('post-container');
            container.innerHTML = `
                <h1>Blog</h1>
                <hr class="dashed">
                <p id="intro">Posts, write-ups, and things I've built.</p>
                ${entries.length
                    ? `<ul class="entries">${rows}</ul>`
                    : `<p class="muted">Nothing here yet. Check back soon.</p>`}
            `;

            document.getElementById('loading').classList.add('hidden');
            container.classList.remove('hidden');
        }

        function showNotFound() {
            document.title = `Not found — ${SITE_AUTHOR}`;
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('not-found').classList.remove('hidden');
        }

        window.addEventListener('scroll', () => {
            const doc = document.documentElement;
            const max = doc.scrollHeight - doc.clientHeight;
            const scrolled = max > 0 ? doc.scrollTop / max : 0;
            document.getElementById('progress-bar').style.width = (scrolled * 100) + '%';
        });

        async function copyLink() {
            const btn = document.getElementById('share-btn');
            try {
                await navigator.clipboard.writeText(window.location.href);
                btn.textContent = 'Copied!';
            } catch {
                btn.textContent = 'Copy failed';
            }
            setTimeout(() => { btn.textContent = 'Copy link'; }, 2000);
        }

        init();
    </script>
</body>
</html>
